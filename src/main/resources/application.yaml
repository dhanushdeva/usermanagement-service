# =============================================================================
# User Management Service - LOCAL configuration
# Same keys as bm-usermanagement-v4; every URL points to localhost and to the
# local Keycloak (realm "master").
# =============================================================================
server:
  forward-headers-strategy: FRAMEWORK
  servlet:
    context-path: /
  max-http-request-header-size: '200000'
  port: '9012'

spring:
  application:
    name: User Management
  config:
    # local secrets (UM_ADMIN_CLIENT_SECRET, UM_ANONYMOUS_CLIENT_SECRET); optional so environment variables also work
    import: optional:file:./secrets.properties
  main:
    banner-mode: 'off'
  security:
    oauth2:
      resourceserver:
        jwt:
          # public keys of the local realm, used to verify the caller's bearer token
          jwk-set-uri: ${bm.idp.keycloak.url}/realms/${bm.idp.keycloak.admin.realm}/protocol/openid-connect/certs

app:
  security:
    # comma separated; these URLs need no token (everything else needs a Bearer token)
    public-urls: /usermanagement/anonymous,/swagger-ui.html,/swagger-ui/**,/v3/**,/actuator/**,/error

bm:
  idp:
    provider: keycloak
    keycloak:
      # true = user must change the password on first login
      isTemporary: false
      # true = no password on register; Keycloak sends a "verify email + set password" mail (needs SMTP in the realm)
      enableEmailVerification: false
      url: http://localhost:8080
      email_lifespan: 900
      admin:
        # realm that holds the users and roles
        realm: master
        # confidential client with a service account that has realm-management roles
        client_id: um-admin
        client_secret: ${UM_ADMIN_CLIENT_SECRET}
        redirect_url: http://localhost:9012/*
      anonymous:
        # confidential client used to issue anonymous (guest) tokens
        client_id: um-anonymous
        client_secret: ${UM_ANONYMOUS_CLIENT_SECRET}

service:
  server_url: http://localhost:${server.port}/

# Keycloak realm roles allowed to call each API (comma separated). Same as the original: PM_CREATE for everything.
apipermission:
  api:
    register: PM_CREATE
    deleteUsers: PM_CREATE
    retrieveAndDeleteAnonymousUser: PM_CREATE
    validateIdpRole: PM_CREATE
    addRole: PM_CREATE
    deleteRole: PM_CREATE
    updateUser: PM_CREATE
    changeUserStatus: PM_CREATE
    roleAndComposite: PM_CREATE
    userInformation: PM_CREATE
    resendVerificationMail: PM_CREATE
    users: PM_CREATE

# actuator on the application port: http://localhost:9012/actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health,info

